[project]
name = "leetgpu-local"
version = "0.1.0"
description = "Local LeetGPU server for running CUDA challenges"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "numpy<2",
    "torch>=2.0",
]

[project.optional-dependencies]
# Runpod Flash backend — for Macs (or any host) with no local CUDA.
# Install with:  uv sync --extra remote   (or pip install -e .[remote])
remote = ["runpod-flash>=1.11"]

[project.scripts]
leetgpu-local = "server:app"
